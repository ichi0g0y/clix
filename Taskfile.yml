version: "3"

tasks:
  build:
    desc: ワークスペース全体のリリースビルド
    cmds:
      - cargo build --release --workspace

  test:
    desc: ワークスペース全体のテスト実行
    cmds:
      - cargo test --workspace

  dev:ghx:
    desc: ghx の開発用ビルド＆実行 (引数はそのまま渡される)
    cmds:
      - cargo run -p ghx -- {{.CLI_ARGS}}

  dev:wranglerx:
    desc: wranglerx の開発用ビルド＆実行 (引数はそのまま渡される)
    cmds:
      - cargo run -p wranglerx -- {{.CLI_ARGS}}

  dev:stripex:
    desc: stripex の開発用ビルド＆実行 (引数はそのまま渡される)
    cmds:
      - cargo run -p stripex -- {{.CLI_ARGS}}

  dev:flyx:
    desc: flyx の開発用ビルド＆実行 (引数はそのまま渡される)
    cmds:
      - cargo run -p flyx -- {{.CLI_ARGS}}

  # Release every tool whose origin/main version is not yet tagged on origin
  # (already-released versions are skipped). Forwards flags, e.g.
  #   task release -- --dry-run    # show what would be released, no side effects
  release:
    desc: リリース可能な全ツール (origin/main で未タグのもの) をローカルでまとめてリリース
    cmds:
      - bash scripts/release-all.sh {{.CLI_ARGS}}

  # Per-CLI local release pipeline. Delegates to scripts/release.sh
  # (preflight→check→build→package→tag→publish→verify). No CI: builds, packages,
  # and publishes (GitHub Release + Homebrew tap) entirely on this machine.
  # Pass through flags with `--`, e.g.:
  #   task release:ghx -- --dry-run        # rehearse, no side effects
  #   task release:ghx -- --to=build       # build all targets, stop
  #   task release:ghx -- --from=publish   # resume upload from existing dist/
  # Requires Docker running (cross) and gh auth with contents:write on
  # nantokaworks/clix and nantokaworks/homebrew-tap. See RELEASING.md.
  release:ghx:
    desc: ghx をローカルでビルドしてリリース (build→package→tag→publish→verify、CIなし)
    cmds:
      - bash scripts/release.sh ghx {{.CLI_ARGS}}

  release:wranglerx:
    desc: wranglerx をローカルでビルドしてリリース (build→package→tag→publish→verify、CIなし)
    cmds:
      - bash scripts/release.sh wranglerx {{.CLI_ARGS}}

  release:stripex:
    desc: stripex をローカルでビルドしてリリース (build→package→tag→publish→verify、CIなし)
    cmds:
      - bash scripts/release.sh stripex {{.CLI_ARGS}}

  release:flyx:
    desc: flyx をローカルでビルドしてリリース (build→package→tag→publish→verify、CIなし)
    cmds:
      - bash scripts/release.sh flyx {{.CLI_ARGS}}
