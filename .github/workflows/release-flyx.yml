name: Release flyx

# Routine releases run locally via `task release:flyx` (scripts/release.sh).
# This CI matrix build is kept as a manual-only fallback. Trigger with:
#   gh workflow run release-flyx.yml --ref flyx-v<version>
# (the tag-prefix guard below still validates the ref).
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            mingw: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross-compilation tools (windows-gnu)
        if: matrix.mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            flyx-v*) ;;
            *)
              echo "::error::Release requires a 'flyx-v*' tag ref (got '$TAG'). Re-run the workflow from a flyx-v* tag, not a branch." >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#flyx-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: ${{ matrix.mingw && 'x86_64-w64-mingw32-gcc' || '' }}
        run: cargo build --release -p flyx --target ${{ matrix.target }}

      - name: Package (tarball)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../flyx-v${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz flyx
          cd ../../..

      - name: Package (zip)
        if: ${{ contains(matrix.target, 'windows') }}
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../flyx-v${{ steps.version.outputs.version }}-${{ matrix.target }}.zip flyx.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyx-${{ matrix.target }}
          path: flyx-v${{ steps.version.outputs.version }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            flyx-v*) ;;
            *)
              echo "::error::Release requires a 'flyx-v*' tag ref (got '$TAG'). Re-run the workflow from a flyx-v* tag, not a branch." >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#flyx-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd artifacts
          for f in flyx-v*; do
            sha256sum "$f"
          done | tee ../checksums.txt

          echo "sha_macos_arm=$(sha256sum flyx-v${VERSION}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_macos_x86=$(sha256sum flyx-v${VERSION}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_linux_arm=$(sha256sum flyx-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_linux_x86=$(sha256sum flyx-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_windows_x86=$(sha256sum flyx-v${VERSION}-x86_64-pc-windows-gnu.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            checksums.txt

      - name: Update Homebrew formula
        # HOMEBREW_TAP_TOKEN minimum scopes (fine-grained PAT on nantokaworks/homebrew-tap):
        #   Contents:      Read & Write   (clone + push to main)
        #   Metadata:      Read           (default)
        #   Pull requests: No access      (direct-push flow; PR scope not needed)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA_MACOS_ARM: ${{ steps.sha.outputs.sha_macos_arm }}
          SHA_MACOS_X86: ${{ steps.sha.outputs.sha_macos_x86 }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.sha_linux_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.sha_linux_x86 }}
        run: |
          BASE_URL="https://github.com/nantokaworks/clix/releases/download/${TAG}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nantokaworks/homebrew-tap.git" homebrew-tap
          cd homebrew-tap
          mkdir -p Formula

          printf '%s\n' \
            'class Flyx < Formula' \
            '  desc "Multi-account Fly.io CLI wrapper, powered by fly"' \
            '  homepage "https://github.com/nantokaworks/clix"' \
            '  license "MIT"' \
            '' \
            '  livecheck do' \
            '    url :stable' \
            '    strategy :github_latest' \
            '  end' \
            '' \
            '  on_macos do' \
            '    on_arm do' \
            "      url \"${BASE_URL}/flyx-v${VERSION}-aarch64-apple-darwin.tar.gz\"" \
            "      sha256 \"${SHA_MACOS_ARM}\"" \
            '    end' \
            '    on_intel do' \
            "      url \"${BASE_URL}/flyx-v${VERSION}-x86_64-apple-darwin.tar.gz\"" \
            "      sha256 \"${SHA_MACOS_X86}\"" \
            '    end' \
            '  end' \
            '' \
            '  on_linux do' \
            '    on_arm do' \
            "      url \"${BASE_URL}/flyx-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz\"" \
            "      sha256 \"${SHA_LINUX_ARM}\"" \
            '    end' \
            '    on_intel do' \
            "      url \"${BASE_URL}/flyx-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz\"" \
            "      sha256 \"${SHA_LINUX_X86}\"" \
            '    end' \
            '  end' \
            '' \
            '  def install' \
            '    bin.install "flyx"' \
            '  end' \
            '' \
            '  test do' \
            '    assert_match version.to_s, shell_output("#{bin}/flyx version 2>&1")' \
            '  end' \
            'end' > Formula/flyx.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/flyx.rb
          if git diff --cached --quiet; then
            echo "No formula changes"
            exit 0
          fi

          git commit -m "flyx ${VERSION}"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "push to main rejected (attempt ${attempt}); retrying"
            sleep 5
          done
          echo "failed to push formula update to homebrew-tap main after retries" >&2
          exit 1
